<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - NR Music Player</title>
  <link rel="stylesheet" href="style1.css" />
  <link rel="manifest" href="/music/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/music/icons/icon-192.png">

</head>
  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/music/sw.js");
}
</script>

<body class="auth-body">
  <div class="background"></div>

  <div class="auth-container">
    <h1>🎵 NR Music Player</h1>
    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <p class="switch-link">Don’t have an account? 
      <a href="register.html">Register</a>
    </p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
